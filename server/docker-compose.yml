# Includes its own Postgres — nothing else needs to exist on the VPS beyond
# this stack.
#
# Reverse proxy: Nginx Proxy Manager (NPM), not Traefik. NPM has no
# label-based service discovery — it's configured through its own web UI —
# so `api` just publishes a host port; point an NPM Proxy Host at
# `<vps-ip>:${HOST_PORT}` (forwarding to breath.lysyweb.pl, SSL handled by
# NPM's own Let's Encrypt integration). Change HOST_PORT in .env if 8080 is
# already taken by something else on the VPS.
#
# Deployed straight from the prebuilt ghcr.io image (see
# .github/workflows/server-docker.yml) — Portainer only ever pulls, it never
# builds. Set IMAGE_TAG in .env to pin a specific tag; defaults to `latest`.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    image: ghcr.io/lysyokrutnik/okrutnik-breath-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # `${VAR}` here is resolved by docker-compose itself from whatever env
    # source is deploying the stack (Portainer's own "Environment variables"
    # UI, a shell env, etc.) — unlike `env_file: .env`, this never depends on
    # a literal file existing on disk next to docker-compose.yml, which
    # broke under Portainer's git-repository deploy method (the compose file
    # lives in server/, but Portainer's managed .env sits at the stack root).
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH}
      NOTIFICATIONS_CRON_HOUR: ${NOTIFICATIONS_CRON_HOUR:-19}
    depends_on:
      - postgres
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    networks:
      - internal

  # One-off: `docker compose --profile tools run --rm migrate`. Same image as
  # `api` — `prisma` (the CLI) ships as a regular dependency precisely so
  # this doesn't need a separate build-stage image.
  migrate:
    image: ghcr.io/lysyokrutnik/okrutnik-breath-server:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - internal
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    profiles:
      - tools

networks:
  internal:

volumes:
  postgres_data:

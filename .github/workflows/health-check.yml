name: Health check alert

# Basic uptime monitoring — no dedup/backoff: while the backend stays
# unhealthy, an alert email fires on every run (every 10 minutes). Simple
# on purpose; revisit if that turns out to be too noisy in practice.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check /health
        id: health
        run: |
          set +e
          status=$(curl -s -o /tmp/health_body.json -w '%{http_code}' --max-time 10 https://breath.lysyweb.pl/health)
          body=$(cat /tmp/health_body.json 2>/dev/null || echo '')
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "body=$body" >> "$GITHUB_OUTPUT"
          if [ "$status" = "200" ] && echo "$body" | grep -q '"ok":true'; then
            exit 0
          fi
          exit 1

      # Uses only Python's stdlib smtplib — no third-party marketplace
      # action to trust for something that sends real credentials.
      - name: Send alert email
        if: failure()
        env:
          SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.ALERT_MAIL_TO }}
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
          HEALTH_BODY: ${{ steps.health.outputs.body }}
        run: |
          python3 - <<'PYEOF'
          import os
          import smtplib
          import ssl
          from email.mime.text import MIMEText

          user = os.environ['SMTP_USER']
          password = os.environ['SMTP_PASSWORD']
          to = os.environ['MAIL_TO']
          status = os.environ.get('HEALTH_STATUS') or '(no response)'
          body_text = os.environ.get('HEALTH_BODY') or '(empty)'

          msg = MIMEText(
              f"breath.lysyweb.pl/health did not report healthy.\n\n"
              f"HTTP status: {status}\nBody: {body_text}\n"
          )
          msg['Subject'] = 'ALERT: Breath of the Bald backend is unhealthy'
          msg['From'] = user
          msg['To'] = to

          context = ssl.create_default_context()
          with smtplib.SMTP('smtp.gmail.com', 587) as server:
              server.starttls(context=context)
              server.login(user, password)
              server.sendmail(user, [to], msg.as_string())
          PYEOF
